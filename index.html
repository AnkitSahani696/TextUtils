<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text Analyzer</title>

  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #222;
      --muted: #6c757d;
      --primary: #0d6efd;
    }
    .dark {
      --bg: #0b1220;
      --card: #0f1724;
      --text: #e6eef8;
      --muted: #a9b6c8;
      --primary: #60a5fa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      transition: background .25s, color .25s;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    .card-custom {
      background: var(--card);
      box-shadow: 0 6px 18px rgba(2,6,23,0.08);
      border: none;
      border-radius: 12px;
    }

    .muted { color: var(--muted); }

    /* Navbar search suggestions */
    .search-suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 2000;
      max-height: 240px;
      overflow-y: auto;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.06);
      background: var(--card);
      margin-top: .35rem;
    }
    .suggestion-item {
      padding: .45rem .75rem;
      cursor: pointer;
    }
    .suggestion-item:hover, .suggestion-item.active {
      background: rgba(13,110,253,0.06);
    }

    /* small tweaks */
    .logo {
      display:flex;
      align-items:center;
      gap: .5rem;
      text-decoration: none;
      color: inherit;
    }
    .logo svg { width:36px; height:36px; }
    @media (max-width:575px){
      .container-main { padding: 1rem; }
      .search-input { width: 160px; }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg" id="mainNav" style="background: transparent;">
  <div class="container-fluid px-3 px-md-4">
    <a class="logo" href="#">
      <!-- AI-style SVG Logo -->
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" x2="1">
            <stop offset="0" stop-color="#60a5fa"/>
            <stop offset="1" stop-color="#7c3aed"/>
          </linearGradient>
        </defs>
        <rect rx="10" width="64" height="64" fill="url(#g)"/>
        <g transform="translate(12,12)" fill="#fff">
          <path d="M10 0h18a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4z" opacity="0.15"/>
          <path d="M6 6h20v2H6zM6 12h20v2H6zM6 18h20v2H6z" />
        </g>
      </svg>
      <div>
        <div style="font-weight:700;line-height:1;">Text Analyzer</div>
        <small class="muted">Smart text tools</small>
      </div>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCollapse"
      aria-controls="navCollapse" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navCollapse">
      <ul class="navbar-nav ms-auto align-items-center me-3">
        <li class="nav-item d-none d-md-block me-2">
          <a class="nav-link muted" href="#">Features</a>
        </li>
        <li class="nav-item d-none d-md-block me-2">
          <a class="nav-link muted" href="#">Docs</a>
        </li>
      </ul>

      <!-- Search + suggestions -->
      <div class="position-relative me-2" style="min-width:220px;">
        <input id="navSearch" class="form-control search-input" type="search" placeholder="Search tools, e.g. 'char count'">
        <div id="suggestionsBox" class="search-suggestions d-none"></div>
      </div>

      <!-- Dark mode toggle -->
      <div class="form-check form-switch align-items-center">
        <input class="form-check-input" type="checkbox" id="themeToggle">
        <label class="form-check-label muted" for="themeToggle">Dark</label>
      </div>
    </div>
  </div>
</nav>

<!-- Main content -->
<div class="container container-main" style="max-width:960px; margin-top:28px; margin-bottom:48px;">
  <div class="card card-custom p-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <h2 class="mb-1">Text Analyzer</h2>
        <p class="muted mb-0">Use the options below to clean or analyze your text.</p>
      </div>
      <div class="text-end d-none d-sm-block">
        <small class="muted">Fast • Simple • Private</small>
      </div>
    </div>

    <!-- Form -->
    <form action="/analyze" method="get">
      <div class="mb-3">
        <textarea name="text" class="form-control" rows="6" placeholder="Paste or type your text here..."></textarea>
      </div>

      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-8">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="removepunc" name="removepunc">
            <label class="form-check-label" for="removepunc">Remove Punctuation</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="uppercase" name="uppercase">
            <label class="form-check-label" for="uppercase">Uppercase</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="newlineremover" name="newlineremover">
            <label class="form-check-label" for="newlineremover">Remove New Lines</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="extraspaceremover" name="extraspaceremover">
            <label class="form-check-label" for="extraspaceremover">Remove Extra Spaces</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="charcount" name="charcount">
            <label class="form-check-label" for="charcount">Character Counter</label>
          </div>
        </div>

        <div class="col-12 col-md-4 text-md-end">
          <button type="submit" class="btn btn-primary px-4">Analyze</button>
        </div>
      </div>
    </form>

    <!-- quick helper -->
    <div class="mt-3 muted" style="font-size:14px;">
      Tip: Use the navbar search to quickly jump to tools. Suggestions are interactive.
    </div>
  </div>
</div>

<!-- Bootstrap JS (CDN) and Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  /**********************
   * Theme (Light/Dark)
   **********************/
  const root = document.documentElement;
  const body = document.body;
  const toggle = document.getElementById('themeToggle');

  function applyTheme(isDark){
    if(isDark){
      body.classList.add('dark');
      toggle.checked = true;
    } else {
      body.classList.remove('dark');
      toggle.checked = false;
    }
  }

  // Load preference
  const pref = localStorage.getItem('ta_theme');
  if(pref === 'dark') applyTheme(true);
  else if(pref === 'light') applyTheme(false);
  else {
    // fallback: system preference
    const darkPref = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(darkPref);
  }

  toggle.addEventListener('change', () => {
    const isDark = toggle.checked;
    applyTheme(isDark);
    localStorage.setItem('ta_theme', isDark ? 'dark' : 'light');
  });

  /*********************************
   * Live Search Suggestions
   *********************************/
  const searchInput = document.getElementById('navSearch');
  const suggestionsBox = document.getElementById('suggestionsBox');

  // Sample suggestions (you can extend)
  const SUGGESTIONS = [
    'Character Counter',
    'Remove Punctuation',
    'Uppercase Converter',
    'Remove New Lines',
    'Remove Extra Spaces',
    'Word Count',
    'Download Text',
    'Copy to Clipboard',
    'Reverse Text',
    'Title Case'
  ];

  let filtered = [];
  let activeIndex = -1;

  function renderSuggestions(list) {
    if(!list.length){
      suggestionsBox.classList.add('d-none');
      suggestionsBox.innerHTML = '';
      return;
    }
    suggestionsBox.classList.remove('d-none');
    suggestionsBox.innerHTML = list.map((s,i) =>
      `<div class="suggestion-item ${i===activeIndex?'active':''}" data-idx="${i}">${s}</div>`
    ).join('');
  }

  function updateFilter() {
    const q = searchInput.value.trim().toLowerCase();
    if(!q){ filtered = []; renderSuggestions(filtered); return; }
    filtered = SUGGESTIONS.filter(s => s.toLowerCase().includes(q));
    activeIndex = -1;
    renderSuggestions(filtered);
  }

  searchInput.addEventListener('input', updateFilter);

  // keyboard navigation
  searchInput.addEventListener('keydown', (e) => {
    if(suggestionsBox.classList.contains('d-none')) return;
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, filtered.length - 1);
      renderSuggestions(filtered);
      scrollActiveIntoView();
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      renderSuggestions(filtered);
      scrollActiveIntoView();
    } else if(e.key === 'Enter'){
      if(activeIndex > -1){
        e.preventDefault();
        chooseSuggestion(activeIndex);
      }
    } else if(e.key === 'Escape'){
      suggestionsBox.classList.add('d-none');
    }
  });

  function scrollActiveIntoView(){
    const el = suggestionsBox.querySelector('.suggestion-item.active');
    if(el) el.scrollIntoView({block: 'nearest'});
  }

  // click selection
  suggestionsBox.addEventListener('click', (e) => {
    const it = e.target.closest('.suggestion-item');
    if(!it) return;
    const idx = Number(it.dataset.idx);
    chooseSuggestion(idx);
  });

  function chooseSuggestion(idx){
    const val = filtered[idx];
    if(!val) return;
    searchInput.value = val;
    suggestionsBox.classList.add('d-none');

    // Optional: if suggestion matches a tool name, focus the corresponding checkbox in form
    // Map tool-friendly names to checkbox IDs:
    const map = {
      'Character Counter': 'charcount',
      'Remove Punctuation': 'removepunc',
      'Uppercase Converter': 'uppercase',
      'Uppercase': 'uppercase',
      'Remove New Lines': 'newlineremover',
      'Remove Extra Spaces': 'extraspaceremover',
      'Word Count': null
    };
    const id = map[val];
    if(id){
      // scroll to form and toggle the checkbox (brief highlighting)
      const cb = document.getElementById(id);
      if(cb){
        cb.scrollIntoView({behavior:'smooth', block:'center'});
        cb.checked = true;
        cb.classList.add('border', 'border-2');
        setTimeout(()=> cb.classList.remove('border', 'border-2'), 900);
      }
    }
  }

  // clicking outside closes suggestions
  document.addEventListener('click', (e) => {
    if(!e.target.closest('#suggestionsBox') && !e.target.closest('#navSearch')) {
      suggestionsBox.classList.add('d-none');
    }
  });
</script>
</body>
</html>
